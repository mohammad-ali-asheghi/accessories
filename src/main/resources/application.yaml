spring:
  application:
    name: accessories
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: ${JPA_SHOW_SQL:false}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  thymeleaf:
    cache: true
  web:
    resources:
      cache:
        period: 2592000
    error:
      include-stacktrace: never
      include-message: never

server:
  port: ${PORT:8080}
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,image/svg+xml

telegram:
  bot:
    token: ${BOT_TOKEN:}
    api-url: ${BOT_API_URL:https://api.telegram.org}

supabase:
  url: ${SUPABASE_URL:}
  key: ${SUPABASE_KEY:}

app:
  admin:
    mobile: ${ADMIN_MOBILES:}
    password: ${ADMIN_PASSWORD:}
    chat-id: ${ADMIN_CHAT_IDS:}
  upload:
    dir: ${UPLOAD_DIR:/app/uploads}
  seller:
    name: ${SELLER_NAME:فروشگاه اکسسوری}
    phone: ${SELLER_PHONE:09120001234}
    telegram: ${SELLER_TELEGRAM:your_telegram_id}
    instagram: ${SELLER_INSTAGRAM:your_instagram_id}
    bale: ${SELLER_BALE:your_bale_id}
    whatsapp: ${SELLER_WHATSAPP:09120001234}
    address: ${SELLER_ADDRESS:آدرس فروشگاه}