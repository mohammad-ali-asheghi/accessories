<!DOCTYPE html>
<html lang="fa" dir="rtl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0b1120">
    <title>ورود ادمین | فروشگاه اکسسوری</title>
    <link rel="icon" type="image/png" th:href="@{/icon.png}">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>

<div class="auth-page">
    <div class="auth-card glass-card">
        <div class="auth-header">
            <span class="badge badge-amber">Admin Authentication</span>
            <h1 class="auth-title">ورود به پنل مدیریت</h1>
            <p class="auth-subtitle">جهت مدیریت محصولات و تنظیمات فروشگاه وارد شوید.</p>
        </div>

        <div th:if="${error}" class="auth-alert error" th:text="${error}"></div>
        <div th:if="${message}" class="auth-alert success" th:text="${message}"></div>

        <!-- Login Method Tabs -->
        <div class="auth-tabs">
            <button type="button" class="tab-btn active" id="tab-password-btn" onclick="switchTab('password')">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                <span>رمز عبور</span>
            </button>
            <button type="button" class="tab-btn" id="tab-otp-btn" onclick="switchTab('otp')">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                </svg>
                <span>کد یکبار مصرف (OTP)</span>
            </button>
        </div>

        <!-- Tab 1: Password Login Form -->
        <form th:action="@{/login}" method="post" id="form-password" class="auth-form-content">
            <div class="form-group">
                <label for="username">شماره موبایل ادمین</label>
                <input type="text" id="username" name="username" placeholder="09123456789" required autocomplete="username" dir="ltr">
            </div>

            <div class="form-group">
                <label for="password">رمز عبور</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password" dir="ltr">
            </div>

            <button type="submit" class="btn btn-primary submit-auth-btn">
                <span>ورود به سیستم</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
            </button>
        </form>

        <!-- Tab 2: OTP Login Form -->
        <form th:action="@{/otp/send}" method="post" id="form-otp" class="auth-form-content" style="display: none;">
            <div class="form-group">
                <label for="mobile">شماره موبایل ثبت‌شده در بله/تلگرام</label>
                <input type="text" id="mobile" name="mobile" placeholder="09123456789" required autocomplete="tel" dir="ltr">
            </div>

            <p class="otp-notice">
                کد تایید ۶ رقمی به پیام‌رسان بله یا ربات تلگرام شماره شما ارسال خواهد شد.
            </p>

            <button type="submit" class="btn btn-accent submit-auth-btn">
                <span>ارسال کد ورود</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </form>

        <div class="auth-footer">
            <a href="/" class="back-home-link">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span>بازگشت به ویترین فروشگاه</span>
            </a>
        </div>
    </div>
</div>

<script>
function switchTab(mode) {
    const tabPassBtn = document.getElementById('tab-password-btn');
    const tabOtpBtn = document.getElementById('tab-otp-btn');
    const formPass = document.getElementById('form-password');
    const formOtp = document.getElementById('form-otp');

    if (mode === 'password') {
        tabPassBtn.classList.add('active');
        tabOtpBtn.classList.remove('active');
        formPass.style.display = 'flex';
        formOtp.style.display = 'none';
    } else {
        tabOtpBtn.classList.add('active');
        tabPassBtn.classList.remove('active');
        formOtp.style.display = 'flex';
        formPass.style.display = 'none';
    }
}
</script>
</body>
</html>
