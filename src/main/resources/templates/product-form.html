<!DOCTYPE html>
<html lang="fa" dir="rtl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0b1120">
    <title th:text="${isEdit} ? 'ویرایش محصول' : 'افزودن محصول جدید'">فرم محصول</title>
    <link rel="icon" type="image/png" th:href="@{/icon.png}">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/product-form.css}">
</head>
<body>

<div class="form-page">
    <div class="form-card glass-card">
        <div class="form-header">
            <span class="badge badge-amber" th:text="${isEdit} ? 'ویرایش کالا' : 'کالای جدید'">فرم محصول</span>
            <h1 class="form-title" th:text="${isEdit} ? 'ویرایش اطلاعات محصول' : 'افزودن محصول جدید به ویترین'"></h1>
            <p class="form-sub">مشخصات، تصویر و قیمت محصول را جهت نمایش به کاربران وارد نمایید.</p>
        </div>

        <div th:if="${errorMessage}" class="alert-box error" th:text="${errorMessage}"></div>

        <form th:action="${isEdit} ? @{/products/{id}/edit(id=${product.id})} : @{/products/create}"
              th:object="${product}"
              method="post"
              enctype="multipart/form-data"
              id="product-form"
              class="styled-form">

            <!-- Name -->
            <div class="form-group">
                <label for="name">نام محصول <span class="req">*</span></label>
                <input type="text" id="name" th:field="*{name}" placeholder="مثلاً دستبند چرم عقیق سیاه" required autofocus>
            </div>

            <!-- Category & Price in two columns -->
            <div class="form-row">
                <div class="form-group">
                    <label for="category">دسته‌بندی</label>
                    <input type="text" id="category" th:field="*{category}" list="categories-list" placeholder="انتخاب یا تایپ دسته (مثلاً انگشتر)">
                    <datalist id="categories-list">
                        <option value="بدلیجات"></option>
                        <option value="انگشتر"></option>
                        <option value="دستبند"></option>
                        <option value="گردنبند"></option>
                        <option value="گوشواره"></option>
                        <option value="ساعت"></option>
                        <option value="ست و نیم‌ست"></option>
                        <option value="عتیقه‌جات"></option>
                        <option th:each="cat : ${categories}" th:value="${cat}"></option>
                    </datalist>
                </div>

                <div class="form-group">
                    <label for="price">قیمت (تومان)</label>
                    <input type="number" id="price" th:field="*{price}" placeholder="مثلاً 250000" min="0" step="1000">
                    <span id="price-preview" class="field-hint">قیمت به حروف و فرمت در اینجا نمایش داده می‌شود</span>
                </div>
            </div>

            <!-- In Stock Switch -->
            <div class="form-group checkbox-group">
                <label class="switch-container">
                    <input type="checkbox" id="inStock" name="inStock" value="true" th:checked="${product.inStock}">
                    <input type="hidden" name="_inStock" value="on"/>
                    <span class="switch-slider"></span>
                    <span class="switch-label">این محصول در انبار موجود است و قابل سفارش می‌باشد</span>
                </label>
            </div>

            <!-- Image Upload & Preview -->
            <div class="form-group image-upload-group">
                <label>تصویر محصول</label>

                <div class="image-preview-container">
                    <div class="preview-box" id="preview-box">
                        <img th:src="${product.imageUrl != null and !product.imageUrl.isBlank()} ? ${product.imageUrl} : @{/icon.png}"
                             id="image-preview-elem"
                             alt="پیش‌نمایش تصویر"
                             onerror="this.src='/icon.png'">
                    </div>

                    <div class="upload-options">
                        <label for="imageFile" class="file-upload-btn">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="17 8 12 3 7 8"></polyline>
                                <line x1="12" y1="3" x2="12" y2="15"></line>
                            </svg>
                            <span>انتخاب عکس از دستگاه</span>
                            <input type="file" id="imageFile" name="imageFile" accept="image/*">
                        </label>

                        <span class="or-separator">یا آدرس مستقیم تصویر (URL):</span>

                        <input type="url" id="directImageUrl" name="directImageUrl"
                               placeholder="https://example.com/image.jpg"
                               th:value="${isEdit ? product.imageUrl : ''}"
                               class="url-input">

                        <p class="upload-help" th:if="${isEdit}">
                            💡 نکته: در صورتی که مایل به حفظ تصویر قبلی هستید، نیازی به انتخاب عکس جدید نیست.
                        </p>
                    </div>
                </div>
            </div>

            <!-- Description -->
            <div class="form-group">
                <label for="description">توضیحات و مشخصات کامل محصول <span class="req">*</span></label>
                <textarea id="description" th:field="*{description}" rows="5"
                          placeholder="جنس، رنگ، خواص سنگ، ابعاد و هر نکته مهمی که خریدار باید بداند..." required></textarea>
            </div>

            <!-- Form Actions -->
            <div class="form-actions">
                <button type="submit" class="btn btn-primary submit-btn" id="submit-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                        <polyline points="17 21 17 13 7 13 7 21"></polyline>
                        <polyline points="7 3 7 8 15 8"></polyline>
                    </svg>
                    <span th:text="${isEdit} ? 'ذخیره تغییرات محصول' : 'ثبت و انتشار محصول'">ذخیره</span>
                </button>

                <a href="/admin" class="btn btn-outline cancel-btn">بازگشت به پنل</a>
            </div>
        </form>
    </div>
</div>

<script>
// Price preview helper
const priceInput = document.getElementById('price');
const pricePreview = document.getElementById('price-preview');

function updatePricePreview() {
    const val = priceInput.value;
    if (val && !isNaN(val) && Number(val) > 0) {
        pricePreview.textContent = Number(val).toLocaleString('fa-IR') + ' تومان';
        pricePreview.style.color = 'var(--text-emerald)';
        pricePreview.style.fontWeight = '700';
    } else {
        pricePreview.textContent = 'قیمت تعیین نشده (استعلام تلفنی)';
        pricePreview.style.color = 'var(--text-muted)';
        pricePreview.style.fontWeight = 'normal';
    }
}

if (priceInput) {
    priceInput.addEventListener('input', updatePricePreview);
    updatePricePreview();
}

// Live Image Preview
const imageFileInput = document.getElementById('imageFile');
const directUrlInput = document.getElementById('directImageUrl');
const previewElem = document.getElementById('image-preview-elem');

if (imageFileInput) {
    imageFileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(evt) {
                previewElem.src = evt.target.result;
            };
            reader.readAsDataURL(file);
        }
    });
}

if (directUrlInput) {
    directUrlInput.addEventListener('input', function() {
        const url = directUrlInput.value.trim();
        if (url) {
            previewElem.src = url;
        }
    });
}
</script>
</body>
</html>
